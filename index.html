<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8E1E4">
  <title>Nau Raatein, Ek Pyaari Si Dua</title>
  <meta name="description" content="An interactive Navratri scrapbook for Laxmi Jii.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-chapter="welcome">
  <div class="paper-bg" aria-hidden="true"></div>
  <canvas id="petals" aria-hidden="true"></canvas>

  <header class="topbar">
    <button class="icon-btn" id="btnHome" aria-label="Nau Raatein par jaayein">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2 3 2 6 0 9-2-3-2-6 0-9zM5 8c3-1 5 1 7 4-3 1-6-1-7-4zM19 8c-3-1-5 1-7 4 3 1 6-1 7-4zM12 13c3 0 5 3 5 8H7c0-5 2-8 5-8z"/></svg>
    </button>
    <div class="progress-wrap">
      <div class="progress" id="progress" role="img" aria-label="Progress"></div>
      <span class="progress-text" id="progressText"></span>
    </div>
    <button class="icon-btn music" id="btnMusic" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/></svg>
      <svg class="slash" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16"/></svg>
      <span class="sr">Music chalayein</span>
    </button>
  </header>
  <div class="garland" aria-hidden="true"></div>

  <main id="stage" aria-live="polite"></main>
  <div id="toast" class="toast" role="status"></div>

  <noscript><p style="padding:2rem;text-align:center">Is scrapbook ko dekhne ke liye JavaScript chalu karein.</p></noscript>

  <script src="content.js"></script>
  <script src="unlock.js"></script>
  <script src="petals.js"></script>
  <script src="music.js"></script>
  <script src="portrait.js"></script>
  <script src="app.js"></script>
</body>
</html>
